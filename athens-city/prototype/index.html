<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CITY GUIDE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #efe6d8;
  --ink: #1b1612;
  --muted: #6e645b;
  --line: rgba(27, 22, 18, 0.12);
  --surface: #f7f1e7;
  --accent: #d7b56d;
  --sos: #c23b32;
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --sans: "Source Sans 3", "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: #0c0b09; color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
img { max-width: 100%; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
.wrap { width: min(1120px, calc(100% - 36px)); margin-inline: auto; }

/* gate */
#gate { min-height: 100dvh; background: #0c0b09; color: #f4efe6; display: flex; flex-direction: column; }
.gate-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 26px 28px 0; }
.mark { letter-spacing: 0.2em; font-weight: 700; font-size: 0.78rem; }
.continue {
  border: 1px solid rgba(244, 239, 230, 0.35); background: transparent; color: inherit;
  border-radius: 999px; padding: 8px 14px; font-size: 0.88rem;
}
#gate > h1 {
  font-family: var(--serif); font-weight: 500; font-size: clamp(3.4rem, 9vw, 7rem);
  line-height: 0.88; letter-spacing: -0.03em; margin: 18px 28px 8px;
}
.gate-lead { margin: 0 28px 18px; color: rgba(244, 239, 230, 0.72); max-width: 36rem; }
.gate-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 8px 16px 20px; flex: 1; }
.city-pick {
  position: relative; min-height: 52vh; border: 0; padding: 0; border-radius: 28px; overflow: hidden;
  color: white; text-align: left; background: #222;
}
.city-pick img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s ease; }
.city-pick:hover img { transform: scale(1.05); }
.city-pick .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.72) 0%, rgba(0,0,0,.05) 55%); }
.city-pick .meta { position: absolute; left: 22px; right: 22px; bottom: 20px; }
.city-pick small { letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.72rem; font-weight: 700; opacity: 0.85; }
.city-pick strong { display: block; font-family: var(--serif); font-weight: 500; font-size: clamp(2.6rem, 5vw, 4.4rem); line-height: 0.95; margin-top: 4px; }
.city-pick em { display: block; font-style: normal; margin-top: 6px; max-width: 26rem; }
#gateStatus { padding: 0 28px 18px; color: #e7c27a; min-height: 1.2em; }
.lang-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.lang-row button { border: 1px solid rgba(244,239,230,.3); background: transparent; color: inherit; border-radius: 999px; padding: 6px 10px; font-size: 0.78rem; }
.lang-row button[aria-pressed="true"] { background: #f4efe6; color: #1b1612; }
.name-form, .picker { margin: 18px 28px 0; max-width: 520px; display: grid; gap: 10px; }
#gate .name-form label { font-size: 0.82rem; color: #f4efe6; }
.panel .name-form { margin: 12px 0 0; }
.panel .name-form label { font-size: 0.82rem; }
.name-form input, .country-btn, #countrySearch {
  width: 100%; border: 0; border-radius: 16px; padding: 14px 16px; font: inherit; font-size: 1.15rem; background: #f7f1e7; color: #1b1612;
}
.country-btn { display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer; }
.flag { width: 24px; height: 18px; object-fit: cover; border-radius: 2px; }
.country-panel { background: #16130f; border-radius: 16px; padding: 8px; display: grid; gap: 8px; }
#countryList { max-height: 280px; overflow: auto; display: grid; }
#countryList button, .city-list button {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
  border: 0; background: transparent; color: #f4efe6; text-align: left; padding: 10px 12px; border-radius: 12px; font: inherit;
}
#countryList button:hover, .city-list button:hover { background: rgba(255,255,255,.06); }
.city-list { margin: 8px 28px 20px; max-width: 520px; display: grid; }
.city-list button { border: 1px solid rgba(244,239,230,.18); font-family: var(--serif); font-size: 1.45rem; }
.city-list button.uni-city { border-color: #e7c27a; }
.city-list small { font-family: var(--sans); font-size: 0.75rem; letter-spacing: 0.04em; color: #e7c27a; }
#editName { margin: 0 28px 24px; }

/* app chrome */
#app { min-height: 100dvh; background: var(--paper); }
.top {
  position: fixed; z-index: 20; inset: 0 0 auto 0; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 14px 16px; color: #fff;
}
.top.solid { background: rgba(14, 11, 9, 0.9); backdrop-filter: blur(16px); }
.wordmark, .sos {
  border: 0; background: transparent; color: inherit; letter-spacing: 0.16em; font-weight: 700; font-size: 0.75rem;
}
.sos { background: var(--sos); border-radius: 999px; padding: 10px 14px; letter-spacing: 0.08em; }
#topName { font-family: var(--serif); font-size: 1.25rem; font-weight: 500; margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panel { height: 100dvh; overflow: auto; padding-bottom: 120px; scroll-behavior: smooth; }
.panel.pad { padding-top: 78px; }
.panel.pad h1.screen-title {
  font-family: var(--serif); font-weight: 500; font-size: clamp(2.8rem, 7vw, 4.6rem);
  letter-spacing: -0.03em; line-height: 0.95; margin: 8px 0 6px;
}

.hero { position: relative; height: min(68vh, 720px); background: #14110e; overflow: hidden; }
@media (max-height: 780px) { .hero { height: calc(100dvh - 250px); } }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1s ease; }
.hero img.on { opacity: 1; animation: drift 22s ease-in-out alternate infinite; }
@keyframes drift { from { transform: scale(1); } to { transform: scale(1.07); } }
.hero-dots { position: absolute; left: 18px; bottom: 18px; display: flex; gap: 6px; z-index: 2; }
.hero-dots button { width: 8px; height: 8px; border-radius: 99px; border: 0; padding: 0; background: rgba(255,255,255,.45); }
.hero-dots button[aria-pressed="true"] { background: #fff; width: 22px; }
.intro { position: relative; z-index: 2; margin-top: -0.42em; }
.intro h1 {
  font-family: var(--serif); font-weight: 500; font-size: clamp(4.4rem, 13vw, 8.4rem);
  line-height: 0.84; letter-spacing: -0.035em;
}
.intro h1 span { background: var(--paper); box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 0 0.06em; }
.kicker { letter-spacing: 0.16em; text-transform: uppercase; font-size: 0.75rem; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
.lede { font-size: 1.15rem; max-width: 38rem; margin-top: 10px; color: var(--ink); }

.section { margin-top: 36px; }
.facts { display: grid; gap: 12px; margin-top: 14px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; }
.fact h3 { font-family: var(--serif); font-weight: 500; font-size: 1.35rem; }
.fact p { margin-top: 6px; }
.sources { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 8px; }
.sources a { color: var(--ink); }
.section h2 { font-family: var(--serif); font-weight: 500; font-size: 2rem; letter-spacing: -0.02em; }
.sub { color: var(--muted); margin-top: 4px; }

.strip { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 14px 0 8px; scrollbar-width: thin; }
.strip figure { flex: 0 0 min(78vw, 380px); scroll-snap-align: start; margin: 0; }
.strip button { display: block; width: 100%; padding: 0; border: 0; background: none; border-radius: 20px; overflow: hidden; }
.strip img { width: 100%; height: 460px; object-fit: cover; display: block; }
.strip figcaption { margin-top: 8px; font-size: 0.92rem; }
.strip figcaption small { display: block; color: var(--muted); font-size: 0.78rem; }

.tonight {
  margin-top: 28px; border-radius: 24px; overflow: hidden; min-height: 220px; position: relative;
  color: #fff; background: #1b1612; display: grid; align-items: end;
}
.tonight img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tonight .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,.15)); }
.tonight .body { position: relative; padding: 22px; display: grid; gap: 8px; }
.tonight h2 { font-size: 2rem; }
.tonight p { max-width: 36rem; }
.btn, a.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  padding: 10px 16px; font-weight: 650; text-decoration: none; color: var(--ink); font-size: 0.95rem;
}
.btn.pale { background: #fff; color: #1b1612; border-color: transparent; }
.btn.solid { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.modes { display: flex; gap: 6px; flex-wrap: wrap; }
.modes button[aria-pressed="true"], .chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.walks { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0; }
.walk {
  margin-top: 8px; display: grid; background: #16130f; color: #f6f1e8; border-radius: 24px; overflow: hidden;
}
.walk .copy { padding: 22px; }
.walk h3 { font-family: var(--serif); font-weight: 500; font-size: 2rem; }
.walk iframe, .map-embed iframe, #placeMap, #cityMap { width: 100%; border: 0; background: #d9d3c8; min-height: 340px; height: 420px; }
.live-label { font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--accent); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 16px; }
.pcard {
  position: relative; display: block; width: 100%; aspect-ratio: 3/4; padding: 0; border: 0; border-radius: 22px;
  overflow: hidden; text-align: left; color: #fff; background: #241c16; cursor: pointer;
}
.pcard img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
.pcard:hover img { transform: scale(1.05); }
.pcard .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,.02) 58%); }
.pcard .txt { position: absolute; left: 14px; right: 14px; bottom: 14px; }
.pcard h3 { font-family: var(--serif); font-weight: 500; font-size: 1.65rem; line-height: 1.05; }
.pcard small { display: block; opacity: 0.85; margin-top: 4px; }
.pcard.bare { background: #241c16; }
.pcard.bare .txt { top: 16px; bottom: auto; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 2px; }
.chips button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-weight: 600; font-size: 0.9rem; }
.chips button.hall { border-color: var(--accent); }
.chips button.safe { border-color: #2f6b4f; }
.chips button.ride { border-color: #2458a6; }

.word { padding: 20px 0; border-top: 1px solid var(--line); }
.word .en { color: var(--muted); font-size: 0.88rem; font-weight: 650; }
.word .local { font-family: var(--serif); font-size: clamp(1.7rem, 4vw, 2.5rem); font-weight: 500; line-height: 1.12; margin-top: 2px; }
.word .tr { color: var(--muted); }
.note { color: var(--muted); font-size: 0.88rem; margin-top: 6px; }

.field { display: grid; gap: 6px; margin-top: 12px; }
.field input, .field select { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; }
.hint { color: var(--muted); font-size: 0.85rem; }
.check { list-style: none; padding: 0; margin: 12px 0 0; }
.check label { display: flex; gap: 10px; align-items: center; padding: 8px 0; }
.check input { width: 18px; height: 18px; accent-color: #8a6232; }

.changes { list-style: none; padding: 0; margin: 12px 0 0; }
.changes li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.changes p { grid-column: 1 / -1; color: var(--muted); }
.flag { display: inline-flex; border-radius: 999px; padding: 2px 8px; font-size: 0.75rem; font-weight: 700; background: #f3e2b0; color: #6a4b12; }

/* map tab */
.map-panel { display: flex; flex-direction: column; padding-bottom: 88px; }
#cityMap { height: calc(100dvh - 250px); min-height: 320px; }
.map-tools { padding: 8px 16px 10px; display: grid; gap: 8px; }
.map-panel iframe { flex: 1; width: 100%; border: 0; min-height: 280px; height: auto; }

/* sheets */
.sheet {
  position: fixed; inset: 0; z-index: 40; background: var(--paper); overflow: auto; padding-bottom: 40px;
}
.sheet-bar { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; background: rgba(239, 230, 216, 0.92); backdrop-filter: blur(12px); z-index: 2; }
.sheet-hero { height: min(52vh, 520px); background: #1b1612; }
.sheet-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sheet .wrap { padding-bottom: 28px; }
.place-title { font-family: var(--serif); font-weight: 500; font-size: clamp(2.4rem, 6vw, 4rem); letter-spacing: -0.03em; line-height: 0.95; margin-top: 16px; }

.call-112 {
  display: grid; gap: 4px; text-decoration: none; color: #fff; background: var(--sos);
  border-radius: 20px; padding: 18px 20px; margin-top: 8px;
}
.call-112 b { font-family: var(--serif); font-size: 4rem; font-weight: 500; line-height: 0.9; }
.numbers { list-style: none; padding: 0; margin: 12px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.numbers a { display: grid; gap: 2px; text-decoration: none; color: var(--ink); background: var(--surface); border-radius: 14px; padding: 12px; border: 1px solid var(--line); }
.numbers b { font-size: 1.4rem; }
.numbers span { color: var(--muted); font-size: 0.82rem; }
.pharm { padding: 14px 0; border-top: 1px solid var(--line); display: grid; gap: 3px; }
.pharm .open { color: #2f7a45; font-weight: 700; }
.pharm .shut { color: var(--muted); }
.banner { background: #f3e2b0; color: #6a4b12; border-radius: 12px; padding: 10px 12px; margin: 10px 0; }

.show, .light {
  position: fixed; inset: 0; z-index: 50; background: #f7f1e7; display: flex; flex-direction: column;
  justify-content: center; padding: 28px; gap: 16px;
}
.light { background: #0c0b09; color: #f4efe6; }
.light img { max-height: 72vh; width: 100%; object-fit: contain; }
.show .big { font-family: var(--serif); font-size: clamp(2rem, 8vw, 3.4rem); font-weight: 500; line-height: 1.1; }
.toast {
  position: fixed; z-index: 60; left: 50%; bottom: 96px; transform: translateX(-50%);
  background: #1b1612; color: #f4efe6; border-radius: 999px; padding: 10px 16px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.toast.on { opacity: 1; }
.dock {
  position: fixed; z-index: 25; left: 50%; bottom: 14px; transform: translateX(-50%);
  width: min(680px, calc(100% - 16px)); display: flex; gap: 2px; padding: 6px;
  border-radius: 999px; background: rgba(16, 12, 10, 0.92); backdrop-filter: blur(16px);
  box-shadow: 0 12px 40px rgba(0,0,0,.3);
}
.dock button { flex: 1; border: 0; background: transparent; color: #f4efe6; border-radius: 999px; padding: 10px 2px; font-size: 0.72rem; font-weight: 650; }
.dock button[aria-selected="true"] { background: var(--accent); color: #1b1612; }

@media (max-width: 800px) {
  .gate-grid { grid-template-columns: 1fr; }
  .city-pick { min-height: 42vh; }
  .strip img { height: 340px; }
  .walk iframe, #placeMap { height: 300px; min-height: 300px; }
}
@media (min-width: 900px) {
  .walk { grid-template-columns: 0.85fr 1.15fr; }
  .walk iframe { height: 100%; min-height: 420px; }
}
@media (prefers-reduced-motion: reduce) {
  .hero img, .hero img.on, .city-pick img, .pcard img { animation: none; transition: none; }
  .panel { scroll-behavior: auto; }
  .city-pick:hover img, .pcard:hover img { transform: none; }
}
</style>
</head>
<body>
<div id="gate">
  <div class="gate-top"><span class="mark">CITY GUIDE</span><div class="lang-row" id="langRow" role="group" aria-label="Language"></div></div>
  <section id="stepWelcome">
    <h1 id="welcomeTitle">Welcome</h1>
    <p class="gate-lead" id="welcomeLead">What should we call you?</p>
    <form id="nameForm" class="name-form">
      <label class="visually-hidden" for="userName" id="nameLabel">Your name</label>
      <input id="userName" name="name" required maxlength="40" autocomplete="name" placeholder="Your name">
      <label for="uniName" id="uniLabel">Your university</label>
      <input id="uniName" name="university" required maxlength="80" autocomplete="organization" placeholder="University name">
      <label for="uniFaculty" id="facultyLabel">Faculty, if there is one</label>
      <input id="uniFaculty" name="faculty" maxlength="80" placeholder="Faculty or school, if you have one">
      <button class="btn pale" type="submit" id="nameGo">Continue</button>
    </form>
  </section>
  <section id="stepCountry" hidden>
    <h1 id="helloTitle"></h1>
    <p class="gate-lead" id="countryLead"></p>
    <div id="uniCityOffer" class="city-list" hidden></div>
    <div class="picker">
      <button type="button" class="country-btn" id="countryBtn" aria-expanded="false" aria-haspopup="listbox"></button>
      <div id="countryPanel" class="country-panel" hidden>
        <input id="countrySearch" type="search" autocomplete="off">
        <div id="countryList" role="listbox"></div>
      </div>
    </div>
    <div id="cityList" class="city-list" hidden></div>
    <form id="cityAddForm" class="name-form" hidden>
      <label for="cityAddInput" id="cityAddLabel"></label>
      <input id="cityAddInput" maxlength="80" autocomplete="off">
      <button class="btn pale" type="submit" id="cityAddGo"></button>
    </form>
    <p id="gateStatus"></p>
    <button type="button" class="continue" id="addFolder" data-add-folder></button>
    <input id="folderInput" type="file" accept=".json,image/*" webkitdirectory directory multiple hidden>
    <button type="button" class="continue" id="editName"></button>
  </section>
</div>

<div id="app" hidden>
  <header class="top" id="top">
    <button type="button" class="wordmark" id="changeCity">CITY GUIDE</button>
    <p id="topName"></p>
    <button type="button" class="sos" id="sosBtn">SOS</button>
  </header>
  <main class="panel" id="panel-today" data-panel="today"></main>
  <main class="panel pad" id="panel-places" data-panel="places" hidden></main>
  <main class="panel map-panel pad" id="panel-map" data-panel="map" hidden></main>
  <main class="panel pad" id="panel-words" data-panel="words" hidden></main>
  <main class="panel pad" id="panel-uni" data-panel="uni" hidden></main>
  <main class="panel pad" id="panel-you" data-panel="you" hidden></main>
  <nav class="dock" role="tablist" aria-label="Main">
    <button type="button" role="tab" data-tab="today" aria-selected="true">Today</button>
    <button type="button" role="tab" data-tab="places" aria-selected="false">Places</button>
    <button type="button" role="tab" data-tab="map" aria-selected="false">Map</button>
    <button type="button" role="tab" data-tab="words" aria-selected="false">Words</button>
    <button type="button" role="tab" data-tab="uni" aria-selected="false">School</button>
    <button type="button" role="tab" data-tab="you" aria-selected="false">You</button>
  </nav>
</div>

<section class="sheet" id="place" hidden role="dialog" aria-modal="true" aria-labelledby="placeTitle">
  <div class="sheet-bar"><button type="button" class="btn" id="placeClose">Close</button><span class="live-label">Live Google Maps</span></div>
  <div class="sheet-hero" id="placeHero" hidden></div>
  <div class="wrap">
    <p class="kicker" id="placeKind"></p>
    <h2 class="place-title" id="placeTitle"></h2>
    <p class="sub" id="placeLocal"></p>
    <p id="placeBlurb" style="margin-top:12px;max-width:40rem"></p>
    <div class="row-actions" id="placeModes"></div>
    <div class="row-actions">
      <button type="button" class="btn" id="placeFrom">From city centre</button>
      <button type="button" class="btn" id="placeSave">Save</button>
      <a class="btn solid" id="placeExternal" target="_blank" rel="noopener">Open in Google Maps</a>
    </div>
    <iframe id="placeMap" title="Route on Google Maps" style="margin-top:14px;border-radius:18px"></iframe>
  </div>
</section>

<section class="sheet" id="sos" hidden role="dialog" aria-modal="true" aria-labelledby="sosTitle">
  <div class="sheet-bar"><h2 id="sosTitle" style="font-family:var(--serif);font-weight:500;font-size:1.8rem;color:var(--sos)">Help now</h2><button type="button" class="btn" id="sosClose">Close</button></div>
  <div class="wrap" id="sosBody"></div>
</section>

<div class="show" id="show" hidden role="dialog" aria-modal="true" aria-labelledby="showBig">
  <p class="big" id="showBig"></p>
  <p class="sub" id="showSmall"></p>
  <button type="button" class="btn solid" id="showClose">Done</button>
</div>
<div class="light" id="light" hidden>
  <button type="button" class="btn pale" id="lightClose">Close</button>
  <img id="lightImg" alt="">
  <p id="lightCap"></p>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const state = {
  catalog: null, city: null, tab: "today", filter: "all", phraseFilter: null,
  mode: "w", originMode: "center", me: null, walkId: null, walkFromMe: false,
  mapPlaceId: null, mapQuery: null, openPlace: null, when: "now", heroTimer: null, heroIndex: 0, voice: null
};
const store = {
  key(k) { return `cg:${state.city.id}:${k}`; },
  get(k, d) { try { const v = localStorage.getItem(this.key(k)); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(this.key(k), JSON.stringify(v)); } catch { /* private mode */ } }
};
const MODES = [["w", "Walk"], ["r", "Transit"], ["d", "Drive"]];
const toast = (msg) => { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 1800); };

function photoURL(file) { return `cities/${state.city.id}/photos/${encodeURIComponent(file)}`; }
function gallery() {
  const known = state.city.photos || [];
  const files = new Set(known.map((p) => p.file));
  const extra = (state.city.folderPhotos || []).filter((f) => !files.has(f)).map((f) => ({
    file: f, caption: f.replace(/\.[^.]+$/, "").replace(/-/g, " "), credit: "In this city folder"
  }));
  return [...known, ...extra];
}
function placeById(id) { return state.city.places.find((p) => p.id === id); }
function currentWalk() { return state.city.walks.find((w) => w.id === state.walkId) || state.city.walks[0]; }
function originPoint() {
  if (state.originMode === "me" && state.me) return `${state.me.lat},${state.me.lng}`;
  const c = state.city.center;
  return `${c.lat},${c.lng}`;
}
function placePoint(p) { return p.query || `${p.lat},${p.lng}`; }
function embedPoint(q, z = 15) {
  return `https://maps.google.com/maps?q=${encodeURIComponent(q)}&z=${z}&output=embed`;
}
function embedSearch(q) {
  return `https://maps.google.com/maps?q=${encodeURIComponent(q)}&z=14&output=embed`;
}
function embedRoute(origin, stops, mode) {
  const daddr = stops.map(encodeURIComponent).join("+to:");
  return `https://maps.google.com/maps?saddr=${encodeURIComponent(origin)}&daddr=${daddr}&dirflg=${mode}&output=embed`;
}
function externalDir(origin, dest, mode, waypoints = []) {
  const travel = { w: "walking", r: "transit", d: "driving" }[mode] || "walking";
  const u = new URL("https://www.google.com/maps/dir/");
  u.searchParams.set("api", "1");
  u.searchParams.set("origin", origin);
  u.searchParams.set("destination", dest);
  if (waypoints.length) u.searchParams.set("waypoints", waypoints.join("|"));
  u.searchParams.set("travelmode", travel);
  return u.toString();
}
function setFrame(el, src) {
  if (!el || el.dataset.src === src) return;
  el.dataset.src = src;
  el.src = src;
}
function modeButtons(attr) {
  return `<div class="modes" role="group" aria-label="How to travel">${MODES.map(([k, l]) =>
    `<button type="button" class="btn pale" ${attr}="${k}" aria-pressed="${state.mode === k}">${l}</button>`).join("")}</div>`;
}
function walkPoints(walk) {
  const pts = walk.stops.map((s) => `${s.lat},${s.lng}`);
  if (state.walkFromMe && state.me) pts.unshift(`${state.me.lat},${state.me.lng}`);
  return pts;
}
function walkURL(walk) {
  const pts = walkPoints(walk);
  if (pts.length < 2) return embedPoint(pts[0] || originPoint());
  return embedRoute(pts[0], pts.slice(1), state.mode);
}
function walkExternal(walk) {
  const pts = walkPoints(walk);
  return externalDir(pts[0], pts[pts.length - 1], state.mode, pts.slice(1, -1));
}
function placeRouteURL(p) {
  return embedRoute(originPoint(), [placePoint(p)], state.mode);
}
function placeExternal(p) {
  return externalDir(originPoint(), placePoint(p), state.mode);
}
function mapTabURL() {
  if (state.rideTo) return embedRoute(originPoint(), [state.rideTo], state.mode || "r");
  if (state.campusFocus && state.campus && state.campus.query) return embedRoute(originPoint(), [state.campus.query], state.mode || "r");
  if (state.mapQuery) return embedSearch(state.mapQuery);
  if (state.mapPlaceId) {
    const p = placeById(state.mapPlaceId);
    if (p) return placeRouteURL(p);
  }
  const c = state.city.center;
  return embedPoint(`${c.lat},${c.lng}`, 13);
}
function mapExternal() {
  if (state.rideTo) return externalDir(originPoint(), state.rideTo, state.mode || "r");
  if (state.campusFocus && state.campus && state.campus.query) return externalDir(originPoint(), state.campus.query, state.mode || "r");
  if (state.mapQuery) return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(state.mapQuery)}`;
  if (state.mapPlaceId) {
    const p = placeById(state.mapPlaceId);
    if (p) return placeExternal(p);
  }
  const c = state.city.center;
  return `https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lng}`;
}

async function listPhotos(id) {
  try {
    const res = await fetch(`cities/${id}/photos/`);
    if (!res.ok) return [];
    const html = await res.text();
    return [...new Set([...html.matchAll(/href="([^"]+\.(?:jpe?g|png|webp))"/gi)]
      .map((m) => decodeURIComponent(m[1]).split("/").pop().split("?")[0]))];
  } catch { return []; }
}

function renderGate() {
  const last = localStorage.getItem("cg:last");
  const known = state.catalog.cities.find((c) => c.id === last);
  const cont = $("#continueBtn");
  cont.hidden = !known;
  if (known) { cont.textContent = `Continue in ${known.name}`; cont.dataset.city = known.id; }
  $("#gateGrid").innerHTML = state.catalog.cities.map((c) => `
    <button type="button" class="city-pick" data-city="${esc(c.id)}">
      <img src="${esc(c.photo)}" alt="">
      <span class="shade"></span>
      <span class="meta"><small>${esc(c.country)}</small><strong>${esc(c.local || c.name)}</strong><em>${esc(c.line)}</em></span>
    </button>`).join("");
}

let entering = false;
async function enterCity(id) {
  if (entering) return;
  entering = true;
  const card = state.catalog.cities.find((c) => c.id === id);
  $("#gateStatus").textContent = `Opening ${card ? card.name : "city"}…`;
  try {
    const city = await fetch(`cities/${id}/city.json`).then((r) => { if (!r.ok) throw new Error("city"); return r.json(); });
    if (city.pharmacy?.rotaFile) city.pharmacy.rota = await fetch(`cities/${id}/${city.pharmacy.rotaFile}`).then((r) => r.json());
    city.folderPhotos = await listPhotos(id);
    clearInterval(state.heroTimer);
    state.city = city;
    state.tab = "today";
    state.filter = "all";
    state.phraseFilter = city.phraseFilters[0][0];
    state.mode = "w";
    state.originMode = "center";
    state.walkFromMe = false;
    state.walkId = city.walks[0]?.id || null;
    state.mapPlaceId = null;
    state.mapQuery = null;
    state.openPlace = null;
    state.when = "now";
    state.heroIndex = 0;
    document.documentElement.style.setProperty("--accent", city.accent || "#d7b56d");
    localStorage.setItem("cg:last", id);
    document.title = `CITY GUIDE · ${city.name}`;
    $("#topName").textContent = city.localName || city.name;
    $("#topName").lang = city.lang;
    $("#gate").hidden = true;
    $("#app").hidden = false;
    $("#place").hidden = true;
    $("#sos").hidden = true;
    renderToday();
    renderPlaces();
    renderMap();
    renderWords();
    renderYou();
    renderSos();
    setTab("today");
    pickVoice();
  } catch {
    $("#gateStatus").textContent = "Couldn't open this city.";
  } finally { entering = false; }
}

function leaveCity() {
  clearInterval(state.heroTimer);
  $("#app").hidden = true;
  $("#place").hidden = true;
  $("#sos").hidden = true;
  $("#show").hidden = true;
  $("#light").hidden = true;
  $("#gate").hidden = false;
  $("#gateStatus").textContent = "";
  state.city = null;
  document.title = "CITY GUIDE";
  renderGate();
}

function setTab(tab) {
  state.tab = tab;
  $$("[data-panel]").forEach((p) => { p.hidden = p.dataset.panel !== tab; });
  $$("[data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  const panel = $(`[data-panel="${tab}"]`);
  if (panel) panel.scrollTop = 0;
  $("#top").classList.toggle("solid", tab !== "today");
  if (tab === "map") {
    setFrame($("#cityMap"), mapTabURL());
    const ext = $("#mapExternal");
    if (ext) ext.href = mapExternal();
  }
}

function renderToday() {
  const city = state.city;
  const day = new Intl.DateTimeFormat("en-GB", { timeZone: city.timezone, weekday: "long", day: "numeric", month: "long" }).format(new Date());
  const shots = gallery();
  const hero = (city.hero || []).filter((f) => shots.some((g) => g.file === f));
  const ph = city.pharmacy;
  const phPhoto = ph.photo && shots.some((g) => g.file === ph.photo) ? ph.photo : "";
  $("#panel-today").innerHTML = `
    <div class="hero" id="hero">
      ${hero.map((f, i) => `<img src="${photoURL(f)}" alt="" class="${i === 0 ? "on" : ""}">`).join("")}
      <div class="hero-dots" role="group" aria-label="Photograph">${hero.map((f, i) => `<button type="button" data-hero="${i}" aria-label="Photo ${i + 1}" aria-pressed="${i === 0}"></button>`).join("")}</div>
    </div>
    <div class="intro wrap">
      <p class="kicker">${esc(state.userName ? state.userName + " · " : "")}${esc(day)} · ${esc(city.country)}</p>
      <h1 lang="${esc(city.lang)}"><span>${esc(city.localName)}</span></h1>
      <p class="lede">${esc(city.tagline)}</p>
    </div>
    <div class="wrap">
      <section class="tonight" aria-label="Pharmacies">
        ${phPhoto ? `<img src="${photoURL(phPhoto)}" alt="">` : ""}
        <span class="shade"></span>
        <div class="body">
          <p class="live-label">${ph.kind === "sample" ? esc(t("sample")) : esc(t("onDuty"))}</p>
          <h2>${esc(t("pharmacies"))}</h2>
          <p id="tonightLine"></p>
          <div><button type="button" class="btn pale" id="openPharmacy">${ph.kind === "sample" ? esc(t("seeOpen")) : esc(t("findPharmacy"))}</button></div>
        </div>
      </section>
      ${guideHTML(city)}
      ${lifeHTML(city)}
      <section class="section">
        <p class="live-label">${esc(t("aRoute"))}</p>
        <h2>${esc(t("onFoot"))}</h2>
        <div class="walks" id="walkSwitch"></div>
        <article class="walk" id="walkCard"></article>
      </section>
      <section class="section">
        <h2>${esc(t("pictures"))}</h2>
        <p class="sub">${esc(city.fromFolder ? t("folderPics", { n: shots.length }) : t("webPics", { n: shots.length }))}</p>
        <div class="strip" id="film"></div>
      </section>
      ${city.changes ? `<section class="section"><h2>What changed</h2><ul class="changes">${city.changes.map((c) => `<li><strong>${esc(c.title)}</strong><time>${esc(c.t)}</time><p>${esc(c.body)}</p></li>`).join("")}</ul></section>` : ""}
      <section class="section" id="phraseDay"></section>
    </div>`;
  $("#film").innerHTML = shots.map((g) => `
    <figure>
      <button type="button" data-light="${esc(g.file)}" data-cap="${esc(g.caption)}" data-credit="${esc(g.credit)}" aria-label="${esc(g.caption)}">
        <img src="${photoURL(g.file)}" alt="${esc(g.caption)}" loading="lazy">
      </button>
      <figcaption>${esc(g.caption)}<small>${esc(g.credit)}</small></figcaption>
    </figure>`).join("");
  const pod = city.phrases && city.phrases.length ? city.phrases[new Date().getDate() % city.phrases.length] : null;
  $("#phraseDay").innerHTML = pod ? `<h2>${esc(t("phraseDay"))}</h2>
    <div class="word" style="border:0">
      <div class="en">${esc(pod.en)}</div>
      <div class="local" lang="${esc(city.lang)}">${esc(pod.local)}</div>
      <div class="tr">${esc(pod.tr)}</div>
      <div class="row-actions">
        <button type="button" class="btn" data-say="${esc(pod.local)}">${esc(t("listen"))}</button>
        <button type="button" class="btn" data-show="${esc(pod.local)}" data-show-small="${esc(pod.en)}">${esc(t("show"))}</button>
      </div>
    </div>` : "";
  renderWalk();
  renderTonight();
  startHero(hero.length);
  paintOfflineState();
}

function guideHTML(city) {
  const g = city.guide;
  if (!g) return "";
  const tips = (g.safety?.tips || []).map((tip) => `
    <article class="fact">
      <h3>${esc(tx(tip.title))}</h3>
      <p>${esc(tx(tip.body))}</p>
    </article>`).join("");
  const sources = (g.sources || []).map((s) =>
    `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join("");
  const tr = g.transit;
  const transit = tr ? `
    <section class="section">
      <p class="live-label">${esc(tr.operator)}</p>
      <h2>${esc(t("transitTitle"))}</h2>
      <p class="sub">${esc(tr.notes ? tx(tr.notes) : t("transitUnread"))}</p>
      ${tr.apps ? `<p class="sub">${esc(tr.apps)}</p>` : ""}
      <div class="row-actions">
        ${tr.url ? `<a class="btn solid" target="_blank" rel="noopener" href="${esc(tr.url)}">${esc(t("openNotices"))}</a>` : ""}
        ${tr.more ? `<a class="btn" target="_blank" rel="noopener" href="${esc(tr.more)}">Muoversi</a>` : ""}
      </div>
    </section>` : "";
  return `
    <section class="section">
      <h2>${esc(tx(g.safety?.headline) || t("safetyTitle"))}</h2>
      <div class="facts">${tips}</div>
      ${sources ? `<p class="kicker" style="margin-top:16px">${esc(t("sources"))}</p><div class="sources">${sources}</div>` : ""}
    </section>
    ${transit}
    <section class="section">
      <h2>${esc(t("onThisPhone"))}</h2>
      <p class="sub">${esc(t("offlineLead"))}</p>
      <div class="row-actions">
        <button type="button" class="btn solid" data-save-offline>${esc(t("saveOffline"))}</button>
        <button type="button" class="btn" data-add-folder>${esc(t("addFolder"))}</button>
      </div>
      <p class="sub" data-offline-state></p>
      <p class="sub">${esc(t("folderLead"))}</p>
    </section>`;
}

function lifeHTML(city) {
  const groups = city.life && city.life.groups;
  const cost = city.cost;
  if (!groups && !cost) return "";
  const say = (v) => (typeof tx === "function" ? tx(v) : (v && v.en) || v || "");
  const cards = (groups || []).map((g) => {
    const buttons = (g.placeIds || []).map((id) => {
      const p = (city.places || []).find((x) => x.id === id);
      return p ? `<button type="button" class="btn" data-place="${esc(p.id)}">${esc(p.local || p.name)}</button>` : "";
    }).join("");
    const links = (g.links || []).map((s) =>
      `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join("");
    return `<article class="fact">
      <h3>${esc(say(g.title))}</h3>
      <p>${esc(say(g.body))}</p>
      ${buttons ? `<div class="row-actions">${buttons}</div>` : ""}
      ${links ? `<div class="sources">${links}</div>` : ""}
    </article>`;
  }).join("");
  const rows = ((cost && cost.rows) || []).map((r) => `
    <article class="fact">
      <h3>${esc(say(r.label))}</h3>
      <p>${esc(say(r.value))}</p>
      <p class="sub">${esc(say(r.source))}</p>
    </article>`).join("");
  const costLinks = ((cost && cost.links) || []).map((s) =>
    `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join("");
  return `${groups ? `<section class="section">
      <h2>${esc(t("lifeTitle"))}</h2>
      <p class="sub">${esc(t("lifeLead"))}</p>
      <div class="facts">${cards}</div>
    </section>` : ""}
    ${cost ? `<section class="section">
      <h2>${esc(t("costTitle"))}</h2>
      <p class="sub">${esc(t("costLead"))}</p>
      <div class="facts">${rows}</div>
      ${costLinks ? `<div class="sources">${costLinks}</div>` : ""}
    </section>` : ""}`;
}

function startHero(n) {
  clearInterval(state.heroTimer);
  if (n < 2 || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  state.heroTimer = setInterval(() => showHero((state.heroIndex + 1) % n), 6500);
}
function showHero(i) {
  const imgs = $$("#hero img");
  if (!imgs.length) return;
  state.heroIndex = i;
  imgs.forEach((img, n) => img.classList.toggle("on", n === i));
  $$("[data-hero]").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.hero) === i)));
}

function renderWalk() {
  const city = state.city;
  const walk = currentWalk();
  if (!walk) {
    $("#walkSwitch").innerHTML = "";
    $("#walkCard").innerHTML = "";
    return;
  }
  $("#walkSwitch").innerHTML = city.walks.map((w) =>
    `<button type="button" class="btn" data-walk="${esc(w.id)}" aria-pressed="${w.id === walk.id}">${esc(w.title)}</button>`).join("");
  $("#walkCard").innerHTML = `
    <div class="copy">
      <p class="live-label">${walk.minutes} min · ${walk.stops.length} stops</p>
      <h3>${esc(walk.title)}</h3>
      <p style="margin-top:8px">${esc(walk.blurb)}</p>
      <p class="sub" style="margin-top:8px">${walk.stops.map((s) => esc(s.name)).join(" → ")}</p>
      <div class="row-actions">${modeButtons("data-mode")}</div>
      <div class="row-actions">
        <button type="button" class="btn pale" id="walkFrom" aria-pressed="${state.walkFromMe}">${state.walkFromMe ? esc(t("startingFromYou")) : esc(t("startFromMe"))}</button>
        <a class="btn pale" id="walkExternal" target="_blank" rel="noopener" href="${esc(walkExternal(walk))}">${esc(t("openMaps"))}</a>
      </div>
    </div>
    <iframe id="walkFrame" title="Walking route on Google Maps"></iframe>`;
  setFrame($("#walkFrame"), walkURL(walk));
}

function renderTonight() {
  const line = $("#tonightLine");
  if (!line) return;
  const ph = state.city.pharmacy;
  if (ph.kind === "search") { line.textContent = ph.note; return; }
  const at = state.when === "now" ? new Date() : new Date(state.when);
  const open = (ph.rota || []).filter((p) => statusOf(p, at).open).length;
  const current = rotaCurrent(at);
  line.textContent = current
    ? `${open} of ${ph.rota.length} in the sample are open ${state.when === "now" ? "right now" : "at the time you picked"}.`
    : `Sample rota for 28 Sep. ${ph.rota.length} pharmacies. Try 21:30 or 03:00 in Help.`;
}

function renderPlaces() {
  const city = state.city;
  $("#panel-places").innerHTML = `<div class="wrap">
    <h1 class="screen-title">${esc(t("places"))}</h1>
    <p class="sub">${esc(t("placesLead"))}</p>
    <div class="chips" id="filters" role="group" aria-label="Filter"></div>
    <div class="grid" id="grid"></div>
  </div>`;
  paintPlaces();
}
function paintPlaces() {
  const city = state.city;
  $("#filters").innerHTML = city.filters.map(([k, l]) => {
    const key = "filter_" + k;
    const label = typeof I18N !== "undefined" && I18N.en[key] ? t(key) : l;
    return `<button type="button" data-filter="${k}" aria-pressed="${k === state.filter}">${esc(label)}</button>`;
  }).join("");
  const saved = store.get("saved", []);
  const list = city.places.filter((p) => state.filter === "all" || p.cat === state.filter);
  $("#grid").innerHTML = list.map((p) => `
    <button type="button" class="pcard ${p.photo ? "" : "bare"}" data-place="${esc(p.id)}">
      ${p.photo ? `<img src="${photoURL(p.photo)}" alt="">` : ""}
      <span class="shade"></span>
      <span class="txt"><small>${esc(p.kind)}</small><h3 lang="${esc(city.lang)}">${esc(p.local || p.name)}</h3><small>${saved.includes(p.id) ? "Saved" : esc(p.area)}</small></span>
    </button>`).join("");
}

function renderMap() {
  const city = state.city;
  $("#panel-map").innerHTML = `
    <div class="map-tools">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
        <p class="live-label" style="margin:0">Live Google Maps</p>
        <a class="btn" id="mapExternal" target="_blank" rel="noopener">${esc(t("openMaps"))}</a>
      </div>
      <div class="row-actions" style="margin:0">
        ${modeButtons("data-mode")}
        <button type="button" class="btn" id="mapOrigin" aria-pressed="${state.originMode === "me"}">${state.originMode === "me" ? "From you" : "From " + esc(city.center.label)}</button>
      </div>
      <div class="chips" id="mapChips"></div>
    </div>
    <iframe id="cityMap" title="City map on Google Maps"></iframe>`;
  const safeMarks = typeof safestAreas === "function" ? safestAreas(city) : [];
  const ride = typeof campusRide === "function" ? campusRide(city) : null;
  const rideChips = ride ? (ride.lines.length ? ride.lines : [{ name: ride.operator || "Transit" }]) : [];
  $("#mapChips").innerHTML = safeMarks.map((area) =>
    `<button type="button" class="safe" data-map-safe="${esc(area.query)}" aria-pressed="${state.mapQuery === area.query}">${esc(area.name)}</button>`).join("")
    + rideChips.map((line) =>
      `<button type="button" class="ride" data-map-ride="${esc(line.name)}" data-ride-to="${esc(ride.query)}" aria-pressed="${state.rideLine === line.name}">${esc(ride.lines.length ? "GTT " + line.name : line.name)}</button>`).join("")
    + city.places.map((p) =>
    `<button type="button" data-map-place="${esc(p.id)}" aria-pressed="${p.id === state.mapPlaceId}">${esc(p.name)}</button>`).join("")
    + (typeof edisuMarks === "function" ? edisuMarks(city) : []).map((h) =>
      `<button type="button" class="hall" data-map-hall="${esc(h.query)}" aria-pressed="${state.mapQuery === h.query}">EDISU ${esc(h.short)}</button>`).join("");
  const ext = $("#mapExternal");
  ext.href = mapExternal();

function fmtTime(iso) {
  return new Intl.DateTimeFormat("en-GB", { timeZone: state.city.timezone, hour: "2-digit", minute: "2-digit" }).format(new Date(iso));
}
function statusOf(ph, at) {
  const t = at.getTime();
  const open = ph.shifts.find((s) => t >= Date.parse(s.starts_at) && t < Date.parse(s.ends_at));
  if (open) return { open: true, until: open.ends_at };
  const next = ph.shifts.find((s) => Date.parse(s.starts_at) > t);
  return { open: false, next: next ? next.starts_at : null };
}
function rotaCurrent(at) {
  const rota = state.city.pharmacy.rota || [];
  if (!rota.length) return false;
  const first = Math.min(...rota.flatMap((p) => p.shifts.map((s) => Date.parse(s.starts_at))));
  const last = Math.max(...rota.flatMap((p) => p.shifts.map((s) => Date.parse(s.ends_at))));
  return at.getTime() >= first && at.getTime() < last;
}
function renderPharmacies() {
  const pharm = state.city.pharmacy;
  if (pharm.kind !== "sample") return;
  const at = state.when === "now" ? new Date() : new Date(state.when);
  const current = rotaCurrent(at);
  const banner = $("#rotaBanner");
  if (banner) banner.innerHTML = current ? "" : `<p class="banner">This sample covers 28 Sep 08:00 to 29 Sep 08:00. Try 21:30 or 03:00.</p>`;
  const rows = (pharm.rota || []).map((p) => ({ p, st: statusOf(p, at) })).sort((a, b) => (b.st.open - a.st.open) || a.p.area.localeCompare(b.p.area, "el"));
  const list = $("#pharmList");
  if (list) list.innerHTML = rows.map(({ p, st }) => `
    <article class="pharm">
      <strong lang="el">${esc(p.area)}</strong>
      <span class="${st.open ? "open" : "shut"}">${st.open ? `Open until ${fmtTime(st.until)}` : st.next ? `Opens ${fmtTime(st.next)}` : "Closed"}</span>
      <span lang="el">${esc(p.address)}</span>
      <span class="sub">${esc(p.name)}</span>
      <div class="row-actions">
        <a class="btn" href="tel:+30${p.phone}">${esc(p.phone)}</a>
        <button type="button" class="btn" data-show="${esc(p.address + ", " + p.area)}" data-show-small="Please take me to this pharmacy">Show address</button>
        <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.address + " " + p.area + " Αθήνα")}">Map</a>
      </div>
    </article>`).join("") + `<p class="hint">${esc(pharm.source)}</p>`;
  const count = $("#rotaCount");
  if (count) count.textContent = `${rows.filter((r) => r.st.open).length} open.`;
  renderTonight();
}

async function useMe() {
  if (!navigator.geolocation) { toast("This browser has no location"); return false; }
  try {
    const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 8000 }));
    state.me = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    state.originMode = "me";
    toast("Using your location");
    return true;
  } catch {
    toast("Location unavailable. Using the city centre.");
    state.originMode = "center";
    return false;
  }
}

function idb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("city-guide", 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("cities")) db.createObjectStore("cities");
      if (!db.objectStoreNames.contains("files")) db.createObjectStore("files");
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbPut(store, key, value) {
  return idb().then((db) => new Promise((resolve, reject) => {
    const tx = db.transaction(store, "readwrite");
    tx.objectStore(store).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}
function idbGet(store, key) {
  return idb().then((db) => new Promise((resolve, reject) => {
    const req = db.transaction(store, "readonly").objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  }));
}
function idbFiles(prefix) {
  return idb().then((db) => new Promise((resolve, reject) => {
    const req = db.transaction("files", "readonly").objectStore("files").getAllKeys();
    req.onsuccess = () => {
      const keys = (req.result || []).filter((k) => String(k).startsWith(prefix));
      Promise.all(keys.map((key) => idbGet("files", key).then((blob) => [key, blob]))).then(resolve, reject);
    };
    req.onerror = () => reject(req.error);
  }));
}
function ownIndex() {
  try { return JSON.parse(localStorage.getItem("cg:own") || "[]"); } catch { return []; }
}
function offlineIndex() {
  try { return JSON.parse(localStorage.getItem("cg:offline") || "[]"); } catch { return []; }
}
function rememberOffline(id) {
  const list = offlineIndex();
  if (!list.includes(id)) localStorage.setItem("cg:offline", JSON.stringify([...list, id]));
}
async function attachBlobs(city) {
  const rows = await idbFiles(city.id + "/");
  city.blobUrls = city.blobUrls || {};
  rows.forEach(([key, blob]) => {
    if (!blob) return;
    city.blobUrls[String(key).slice(city.id.length + 1)] = URL.createObjectURL(blob);
  });
  return city;
}
async function loadOfflineCity(id) {
  const city = await idbGet("cities", id);
  if (!city) return null;
  city.offlineCopy = true;
  return attachBlobs(city);
}
async function loadOwnCity(id) { return loadOfflineCity(id); }
function paintOfflineState() {
  const on = state.city && offlineIndex().includes(state.city.id);
  document.querySelectorAll("[data-offline-state]").forEach((el) => { el.textContent = on ? t("savedOffline") : ""; });
}
async function downloadCityOffline() {
  const city = state.city;
  if (!city) return;
  const copy = JSON.parse(JSON.stringify(city, (k, v) => (k === "blobUrls" ? undefined : v)));
  await idbPut("cities", city.id, copy);
  const urls = [];
  for (const shot of gallery()) {
    const src = photoURL(shot.file);
    if (!src || src.startsWith("blob:") || /^https?:/i.test(src) && !src.startsWith(location.origin)) continue;
    const abs = new URL(src, location.href).href;
    urls.push(abs);
    try {
      const res = await fetch(abs);
      if (res.ok) await idbPut("files", `${city.id}/${shot.file}`, await res.blob());
    } catch { /* a missing picture stays online-only */ }
  }
  if (navigator.serviceWorker && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({ type: "CACHE_URLS", urls });
  } else if (window.caches) {
    const cache = await caches.open("cg-city");
    for (const url of urls) { try { await cache.add(url); } catch { /* skip */ } }
  }
  rememberOffline(city.id);
  paintOfflineState();
  toast(t("savedOffline"));
}
async function importCityFolder(fileList) {
  const files = [...fileList];
  const jsons = files.filter((f) => /(^|\/)city\.json$/i.test(f.webkitRelativePath || f.name));
  jsons.sort((a, b) => (a.webkitRelativePath || "").length - (b.webkitRelativePath || "").length);
  const jsonFile = jsons[0];
  if (!jsonFile) { toast(t("folderNeedsJson")); return; }
  let city;
  try { city = JSON.parse(await jsonFile.text()); } catch { toast(t("folderBadJson")); return; }
  if (!city || !city.name) { toast(t("folderNeedsName")); return; }
  const id = "own-" + String(city.id || city.name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
  const root = (jsonFile.webkitRelativePath || "city.json").replace(/city\.json$/i, "");
  const images = files.filter((f) => {
    const rel = f.webkitRelativePath || f.name;
    return rel.startsWith(root) && /\.(jpe?g|png|webp)$/i.test(f.name);
  });
  const inPhotos = images.filter((f) => /\/photos\//i.test(f.webkitRelativePath || ""));
  const use = inPhotos.length ? inPhotos : images;
  city.id = id;
  city.localName = city.localName || city.name;
  city.countryCode = String(city.countryCode || state.countryCode || "").toUpperCase();
  city.country = city.country || "";
  city.lang = city.lang || "en";
  city.timezone = city.timezone || "UTC";
  city.center = city.center || { lat: 0, lng: 0, label: city.name };
  city.places = city.places || [];
  city.walks = city.walks || [];
  city.phrases = city.phrases || [];
  city.filters = city.filters || [["all", "All"]];
  city.phraseFilters = city.phraseFilters || [["help", "Help"]];
  city.universities = city.universities || [];
  city.checklist = city.checklist || [["place", "Save a place"]];
  city.pharmacy = city.pharmacy || { kind: "search", query: `pharmacy ${city.name}`, note: t("findPharmacy") };
  city.emergency = city.emergency || (city.countryCode ? emergencyFor(city.countryCode) : {
    primary: { n: "112", label: "Any emergency", note: t("publicNumbers") },
    othersNote: t("publicNumbers"),
    others: []
  });
  city.hospitals = city.hospitals || t("publicNumbers");
  city.youTitle = city.youTitle || city.name;
  city.addressHint = city.addressHint || t("home");
  city.addressPlaceholder = city.addressPlaceholder || city.name;
  city.fromFolder = true;
  if (!city.photos || !city.photos.length) {
    city.photos = use.map((img) => ({ file: img.name, caption: img.name.replace(/\.[^.]+$/, "").replace(/-/g, " "), credit: t("yourFolder") }));
  }
  city.hero = (city.hero && city.hero.length) ? city.hero : city.photos.slice(0, 4).map((p) => p.file);
  city.folderPhotos = use.map((img) => img.name);
  for (const img of use) await idbPut("files", `${id}/${img.name}`, img);
  const stored = JSON.parse(JSON.stringify(city));
  await idbPut("cities", id, stored);
  const idx = ownIndex().filter((c) => c.id !== id);
  idx.push({ id, name: city.name, countryCode: city.countryCode, country: city.country });
  localStorage.setItem("cg:own", JSON.stringify(idx));
  toast(t("folderAdded"));
  if (state.step === "country" && state.countryCode) selectCountry(state.countryCode);
}
